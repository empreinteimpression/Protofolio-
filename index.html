<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Photographie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #faf9f6;        /* Blanc cassé doux */
            --card-bg: #ffffff;
            --text-color: #4a4a4a;     /* Gris charbon adouci */
            --accent-color: #b5c99a;   /* Vert sauge clair */
            --accent-hover: #97a97c;
            --secondary-accent: #f4ece1;/* Sable très doux */
            --font-main: 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* En-tête */
        header {
            text-align: center;
            padding: 60px 20px 30px;
        }

        header h1 {
            font-weight: 300;
            letter-spacing: 3px;
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        header p {
            font-size: 0.95rem;
            color: #7a7a7a;
            letter-spacing: 1px;
        }

        /* Navigation & Filtres */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 20px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--secondary-accent);
            border-color: #e5dccb;
        }

        /* Galerie de photos */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background-color: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            aspect-ratio: 4 / 5;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-item:hover img {
            transform: scale(1.03);
        }

        /* Section Contact & Instagram */
        #contact {
            max-width: 600px;
            margin: 80px auto 0;
            padding: 40px 20px;
            text-align: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        #contact h2 {
            font-weight: 300;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .instagram-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding: 10px 20px;
            background-color: var(--bg-color);
            border-radius: 30px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.95rem;
            transition: background 0.3s ease;
        }

        .instagram-box:hover {
            background-color: var(--secondary-accent);
        }

        .instagram-box i {
            font-size: 1.2rem;
            color: #d62976;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            background-color: var(--bg-color);
            outline: none;
            transition: border 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        button[type="submit"] {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>Mon Portfolio</h1>
        <p>Photographie</p>
    </header>

    <nav>
        <button class="filter-btn active" onclick="filterGallery('all')">Tous</button>
        <button class="filter-btn" onclick="filterGallery('portrait')">Portrait</button>
        <button class="filter-btn" onclick="filterGallery('mariage')">Mariages</button>
        <button class="filter-btn" onclick="filterGallery('grossesse')">Grossesses</button>
    </nav>

    <section class="gallery">
        <div class="photo-item portrait">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Portrait">
        </div>
        <div class="photo-item mariage">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=600&q=80" alt="Mariage">
        </div>
        <div class="photo-item grossesse">
            <img src="https://images.unsplash.com/photo-1555252333-9f8e92e65df9?auto=format&fit=crop&w=600&q=80" alt="Grossesse">
        </div>
        <div class="photo-item portrait">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80" alt="Portrait">
        </div>
        <div class="photo-item mariage">
            <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=600&q=80" alt="Mariage">
        </div>
        <div class="photo-item grossesse">
            <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=600&q=80" alt="Grossesse">
        </div>
    </section>

    <section id="contact">
        <h2>Me Contacter</h2>

        <a href="https://instagram.com/votre_compte" target="_blank" class="instagram-box">
            <i class="fab fa-instagram"></i>
            <span>@votre_compte</span>
        </a>

        <form action="#" method="POST">
            <input type="text" name="name" placeholder="Votre nom" required>
            <input type="email" name="email" placeholder="Votre email" required>
            <textarea name="message" rows="5" placeholder="Votre message..." required></textarea>
            <button type="submit">Envoyer</button>
        </form>
    </section>
