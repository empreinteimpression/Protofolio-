<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Photo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: white;
        }

        h2 {
            margin-top: 30px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        /* Grille de galerie réutilisable pour TOUTES les sections */
        .galerie {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .galerie img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .galerie img:hover {
            transform: scale(1.03);
        }

        /* Fenêtre Modal (Lightbox) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        /* Arrière-plan flou */
        .modal-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.4);
            z-index: -1;
            transition: background-image 0.3s ease;
        }

        /* Image centrale nette */
        .modal-img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            user-select: none;
        }

        /* Bouton de fermeture */
        .fermer {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 35px;
            color: white;
            cursor: pointer;
            z-index: 1001;
            user-select: none;
        }

        /* Flèches de navigation */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 30px;
            border: none;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 1001;
            user-select: none;
            transition: background 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }
    </style>
</head>
<body>

    <h1>Mon Portfolio</h1>

    <!-- Galerie 1 : Nature -->
    <h2>Nature</h2>
    <div class="galerie">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" alt="Brumes sur les montagnes">
        <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=800&q=80" alt="Parc national et lac">
        <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=800&q=80" alt="Forêt ensoleillée">
    </div>

    <!-- Galerie 2 : Voyage -->
    <h2>Voyage</h2>
    <div class="galerie">
        <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80" alt="Voyageur avec carte">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Plage tropicale">
        <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80" alt="Road trip en voiture">
    </div>

    <!-- Lightbox (Vue agrandie) -->
    <div class="modal" id="lightbox">
        <span class="fermer" id="btn-fermer">&times;</span>
        <button class="nav-btn prev" id="btn-prev">&#10094;</button>
        <button class="nav-btn next" id="btn-next">&#10095;</button>
        <div class="modal-bg" id="modal-bg"></div>
        <img class="modal-img" id="modal-img" src="" alt="Vue agrandie">
    </div>

    <script>
        const images = Array.from(document.querySelectorAll('.galerie img'));
        const modal = document.getElementById('lightbox');
        const modalImg = document.getElementById('modal-img');
        const modalBg = document.getElementById('modal-bg');
        const btnFermer = document.getElementById('btn-fermer');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        let currentIndex = 0;

        // Met à jour l'image affichée dans la lightbox
        function updateLightbox(index) {
            currentIndex = index;
            const src = images[currentIndex].getAttribute('src');
            modalImg.src = src;
            modalBg.style.backgroundImage = `url('${src}')`;
        }

        // Événement clic sur chaque image
        images.forEach((img, index) => {
            img.addEventListener('click', () => {
                updateLightbox(index);
                modal.classList.add('active');
            });
        });

        // Navigation Suivante
        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            updateLightbox(currentIndex);
        }

        // Navigation Précédente
        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateLightbox(currentIndex);
        }

        btnNext.addEventListener('click', (e) => {
            e.stopPropagation();
            nextImage();
        });

        btnPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            prevImage();
        });

        // Navigation au clavier (Flèches et Echap)
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'Escape') modal.classList.remove('active');
        });

        // Fermeture
        btnFermer.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal || e.target === modalBg) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
