<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Photographie - Fond Flou</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --accent-color: #b5c99a;
            --accent-hover: #97a97c;
            --secondary-accent: #f4ece1;
            --font-main: 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px;
        }

        header h1 {
            font-weight: 300;
            letter-spacing: 3px;
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        header p {
            font-size: 0.95rem;
            color: #7a7a7a;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 20px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--secondary-accent);
            border-color: #e5dccb;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background-color: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            aspect-ratio: 4 / 5;
            cursor: pointer;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-item:hover img {
            transform: scale(1.04);
        }

        /* =========================================
           LIGHTBOX MODERNE (Visionneuse fond flou)
           ========================================= */
        .lightbox {
            display: none; /* Caché par défaut */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            overflow: hidden; /* Empêche les barres de défilement */
        }

        .lightbox.active {
            display: block;
        }

        /* 1. L'arrière-plan flou */
        .lightbox-bg-blurred {
            position: absolute;
            top: -50px; /* Légèrement plus grand pour masquer les bords du flou */
            left: -50px;
            width: calc(100% + 100px);
            height: calc(100% + 100px);
            
            /* L'image de fond sera définie en JS */
            background-size: cover;
            background-position: center;
            
            /* L'effet de flou crucial */
            filter: blur(20px) brightness(0.6); /* Flou + assombrissement pour le contraste */
            -webkit-filter: blur(20px) brightness(0.6);
            
            z-index: 1;
        }

        /* 2. Le conteneur du contenu (dessus le flou) */
        .lightbox-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 2; /* Devant le fond flou */
        }

        /* Bandeau haut (transparent ou semi-transparent) */
        .lightbox-bar-top {
            width: 100%;
            height: 70px;
            background-color: rgba(0, 0, 0, 0.2); /* Très léger voile sombre */
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 30px;
        }

        .lightbox-close {
            color: #ffffff;
            font-size: 2.5rem;
            cursor: pointer;
            background: none;
            border: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .lightbox-close:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }

        /* Zone centrale de l'image */
        .lightbox-content {
            position: relative;
            flex: 1; /* Prend tout l'espace restant */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* L'image nette principale */
        .lightbox-img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-radius: 4px; /* Optionnel : bords légèrement arrondis */
        }

        /* Boutons de navigation */
        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 1.8rem;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.3s, transform 0.2s;
            backdrop-filter: blur(5px); /* Flou sous les boutons */
        }

        .lightbox-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) scale(1.05);
        }

        .lightbox-btn.prev { left: 30px; }
        .lightbox-btn.next { right: 30px; }

        /* Bandeau bas */
        .lightbox-bar-bottom {
            width: 100%;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* =========================================
           FIN LIGHTBOX
           ========================================= */

        /* Contact & Instagram */
        #contact {
            max-width: 600px;
            margin: 80px auto 0;
            padding: 40px 20px;
            text-align: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        #contact h2 {
            font-weight: 300;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .instagram-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding: 10px 20px;
            background-color: var(--bg-color);
            border-radius: 30px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.95rem;
            transition: background 0.3s ease;
        }

        .instagram-box:hover {
            background-color: var(--secondary-accent);
        }

        .instagram-box i {
            font-size: 1.2rem;
            color: #d62976;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e
