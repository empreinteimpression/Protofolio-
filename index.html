<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    color: #333;
    background: #faf8f3;
}

/* =========================
   HEADER
========================= */

header {
    background: rgba(250, 248, 243, 0.96);
    padding: 22px 0;
    border-bottom: 1px solid #e8e6e0;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 25px;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 30px;
}

/* LOGO */

.logo-link {
    display: flex;
    align-items: center;
    gap: 13px;
    text-decoration: none;
    color: #000;
    cursor: pointer;
}

.logo-symbol {
    width: 42px;
    height: 42px;
    border: 1px solid #222;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: 400;
    line-height: 1;
    transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
}

.logo-link:hover .logo-symbol {
    transform: rotate(-8deg);
    background: #111;
    color: #fff;
}

.logo {
    font-size: 22px;
    font-weight: 600;
    color: #000;
    letter-spacing: 1px;
    white-space: nowrap;
}

.nav-menu {
    display: flex;
    gap: 38px;
    list-style: none;
    align-items: center;
}

.nav-menu a {
    text-decoration: none;
    color: #333;
    font-weight: 500;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    transition: color 0.3s;
}

.nav-menu a:hover {
    color: #999;
}

.nav-menu a.active {
    color: #000;
    border-bottom: 2px solid #000;
    padding-bottom: 5px;
}

.contact-btn {
    background: transparent;
    color: #333;
    padding: 10px 24px;
    border-radius: 2px;
    text-decoration: none;
    font-size: 12px;
    transition: all 0.3s ease;
    border: 1px solid #333;
}

.contact-btn:hover {
    background: #111;
    color: #fff !important;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 620px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 0;
    text-align: center;
    background:
        linear-gradient(
            rgba(0,0,0,0.42),
            rgba(0,0,0,0.42)
        ),
        url('images/mariage/FB_IMG_1788292460682.jpg') center/cover;
    background-attachment: fixed;
    color: #fff;
}

.hero h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(38px, 6vw, 70px);
    margin-bottom: 22px;
    color: #fff;
    font-weight: 400;
    letter-spacing: 2px;
}

.hero p {
    font-size: 18px;
    color: #f0f0f0;
    margin-bottom: 40px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    font-style: italic;
}

.hero-btn {
    display: inline-block;
    background: #fff;
    color: #111;
    padding: 15px 38px;
    text-decoration: none;
    border-radius: 2px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.hero-btn:hover {
    background: #111;
    color: #fff;
}

/* =========================
   CATEGORIES
========================= */

.categories {
    padding: 34px 0;
    border-bottom: 1px solid #e8e6e0;
    background: #faf8f3;
}

.category-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 38px;
    flex-wrap: wrap;
}

.category-link {
    color: #555;
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: none;
    background: none;
    padding: 5px 0;
}

.category-link:hover,
.category-link.active {
    color: #000;
}

.category-link.active {
    border-bottom: 1px solid #000;
}

/* =========================
   GALERIES EDITORIALES
========================= */

.gallery-section {
    padding: 110px 0 130px;
    scroll-margin-top: 100px;
}

.gallery-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(36px, 5vw, 58px);
    margin-bottom: 18px;
    text-align: center;
    color: #171717;
    font-weight: 400;
    letter-spacing: 1px;
}

.gallery-description {
    text-align: center;
    color: #777;
    margin: 0 auto 70px;
    font-size: 15px;
    line-height: 1.9;
    max-width: 680px;
}

/* Grille éditoriale */

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 18px;
    align-items: start;
}

/* Chaque photo */

.gallery-item {
    position: relative;
    overflow: hidden;
    background: #efede8;
    cursor: pointer;
    border-radius: 1px;
    grid-column: span 4;
    transition:
        transform 0.45s ease,
        box-shadow 0.45s ease;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.7s ease;
}

/* Composition éditoriale */

.gallery-item:nth-child(1) {
    grid-column: span 8;
    aspect-ratio: 16 / 10;
}

.gallery-item:nth-child(2) {
    grid-column: span 4;
    aspect-ratio: 4 / 5;
}

.gallery-item:nth-child(3) {
    grid-column: span 4;
    aspect-ratio: 4 / 5;
}

.gallery-item:nth-child(4) {
    grid-column: span 8;
    aspect-ratio: 16 / 10;
}

.gallery-item:nth-child(5) {
    grid-column: span 5;
    aspect-ratio: 4 / 5;
}

.gallery-item:nth-child(6) {
    grid-column: span 7;
    aspect-ratio: 16 / 10;
}

.gallery-item:nth-child(7) {
    grid-column: span 7;
    aspect-ratio: 16 / 10;
}

.gallery-item:nth-child(8) {
    grid-column: span 5;
    aspect-ratio: 4 / 5;
}

.gallery-item:nth-child(9) {
    grid-column: span 6;
    aspect-ratio: 4 / 3;
}

.gallery-item:nth-child(10) {
    grid-column: span 6;
    aspect-ratio: 4 / 3;
}

.gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 45px rgba(0,0,0,0.13);
}

.gallery-item:hover img {
    transform: scale(1.025);
}

/* Overlay */

.gallery-item-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 20px;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,0.35),
            rgba(0,0,0,0) 50%
        );
    opacity: 0;
    transition: opacity 0.35s ease;
}

.gallery-item:hover .gallery-item-overlay {
    opacity: 1;
}

.gallery-item-overlay span {
    color: #fff;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* =========================
   LIGHTBOX
========================= */

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 35px 90px;
    background-color: rgba(245, 243, 238, 0.88);
    background-position: center;
    background-size: cover;
}

.lightbox.active {
    display: flex;
}

/* Fond flou */

.lightbox.active::before {
    content: '';
    position: absolute;
    inset: -30px;
    background-image: inherit;
    background-size: cover;
    background-position: center;
    filter: blur(25px);
    transform: scale(1.08);
    opacity: 0.55;
    z-index: 0;
}

/* Voile */

.lightbox.active::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(250,248,243,0.68);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 1;
}

.lightbox-content {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 90vw;
    max-height: 90vh;
}

/* PHOTO GRANDE : jamais coupée */

.lightbox-img {
    display: block;
    width: auto;
    height: auto;
    max-width: 88vw;
    max-height: 82vh;
    object-fit: contain;
    box-shadow: 0 20px 70px rgba(0,0,0,0.25);
    border-radius: 1px;
}

/* Fermeture */

.lightbox-close {
    position: absolute;
    top: -48px;
    right: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #222;
    font-size: 35px;
    cursor: pointer;
    z-index: 5;
    transition: transform 0.3s ease;
}

.lightbox-close:hover {
    transform: scale(1.12);
}

/* Compteur */

.lightbox-counter {
    position: absolute;
    bottom: -42px;
    left: 50%;
    transform: translateX(-50%);
    color: #222;
    font-size: 12px;
    letter-spacing: 2px;
    white-space: nowrap;
}

/* Flèches */

.lightbox-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(0,0,0,0.08);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 23px;
    color: #222;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: all 0.3s ease;
}

.lightbox-arrow:hover {
    background: #111;
    color: #fff;
}

.lightbox-prev {
    left: 22px;
}

.lightbox-next {
    right: 22px;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #faf8f3;
    padding: 70px 0;
    text-align: center;
    border-top: 1px solid #e8e6e0;
}

.footer-content {
    margin-bottom: 30px;
}

.footer-content p {
    color: #666;
    font-size: 14px;
    margin-bottom: 10px;
}

.social-links {
    display: flex;
    justify-content: center;
    gap: 30px;
}

.social-links a {
    color: #333;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.3s;
}

.social-links a:hover {
    color: #000;
}

.copyright {
    color: #999;
    font-size: 12px;
    margin-top: 30px;
}

/* =========================
   TABLETTE
========================= */

@media (max-width: 900px) {

    .container {
        padding: 0 20px;
    }

    .nav-menu {
        gap: 18px;
    }

    .gallery-grid {
        grid-template-columns: repeat(6, 1fr);
    }

    .gallery-item,
    .gallery-item:nth-child(n) {
        grid-column: span 3;
    }

    .gallery-item:nth-child(1),
    .gallery-item:nth-child(4),
    .gallery-item:nth-child(6),
    .gallery-item:nth-child(7) {
        grid-column: span 6;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header {
        padding: 15px 0;
    }

    nav {
        gap: 12px;
    }

    .logo-symbol {
        width: 35px;
        height: 35px;
        font-size: 21px;
    }

    .logo {
        font-size: 15px;
        letter-spacing: 0.3px;
    }

    .nav-menu {
        gap: 9px;
    }

    .nav-menu a {
        font-size: 9px;
        letter-spacing: 0.3px;
    }

    .contact-btn {
        padding: 8px 10px;
        font-size: 9px;
    }

    .hero {
        min-height: 520px;
        padding: 80px 0;
        background-attachment: scroll;
    }

    .hero h1 {
        font-size: 32px;
    }

    .hero p {
        font-size: 15px;
    }

    .categories {
        padding: 25px 0;
        overflow-x: auto;
    }

    .category-container {
        justify-content: flex-start;
        flex-wrap: nowrap;
        gap: 25px;
        overflow-x: auto;
        scrollbar-width: none;
    }

    .category-container::-webkit-scrollbar {
        display: none;
    }

    .category-link {
        flex: 0 0 auto;
        font-size: 10px;
    }

    .gallery-section {
        padding: 70px 0 80px;
    }

    .gallery-title {
        font-size: 34px;
    }

    .gallery-description {
        font-size: 14px;
        margin-bottom: 40px;
    }

    /* Galerie mobile */

    .gallery-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .gallery-item,
    .gallery-item:nth-child(n) {
        grid-column: span 1;
        aspect-ratio: 4 / 3;
    }

    .gallery-item:nth-child(2),
    .gallery-item:nth-child(5),
    .gallery-item:nth-child(8) {
        aspect-ratio: 4 / 5;
    }

    /* Lightbox mobile */

    .lightbox {
        padding: 25px 45px;
    }

    .lightbox-img {
        max-width: 92vw;
        max-height: 76vh;
    }

    .lightbox-arrow {
        width: 38px;
        height: 38px;
        font-size: 18px;
    }

    .lightbox-prev {
        left: 5px;
    }

    .lightbox-next {
        right: 5px;
    }

    .lightbox-close {
        top: -42px;
        right: -3px;
        font-size: 30px;
    }

    .lightbox-counter {
        bottom: -35px;
        font-size: 10px;
    }
}
</style>
