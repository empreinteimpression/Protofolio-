<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Photo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: white;
        }

        h2 {
            margin-top: 30px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        /* Grille de galerie réutilisable pour TOUTES les sections */
        .galerie {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .galerie img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .galerie img:hover {
            transform: scale(1.03);
        }

        /* Fenêtre Modal (Lightbox) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        /* Arrière-plan flou */
        .modal-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.4);
            z-index: -1;
        }

        /* Image centrale nette */
        .modal-img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        /* Bouton de fermeture */
        .fermer {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 35px;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <h1>Mon Portfolio</h1>

    <!-- Galerie 1 : Nature -->
    <h2>Nature</h2>
    <div class="galerie">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Lac et montagne">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Campagne">
    </div>

    <!-- Galerie 2 : Voyage -->
    <h2>Voyage</h2>
    <div class="galerie">
        <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a" alt="Ville">
        <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad" alt="Château">
    </div>

    <!-- Lightbox (Vue agrandie) -->
    <div class="modal" id="lightbox">
        <span class="fermer" id="btn-fermer">&times;</span>
        <div class="modal-bg" id="modal-bg"></div>
        <img class="modal-img" id="modal-img" src="" alt="Vue agrandie">
    </div>

    <script>
        // On sélectionne TOUTES les images contenues dans un bloc de classe "galerie"
        const images = document.querySelectorAll('.galerie img');
        const modal = document.getElementById('lightbox');
        const modalImg = document.getElementById('modal-img');
        const modalBg = document.getElementById('modal-bg');
        const btnFermer = document.getElementById('btn-fermer');

        // Ajout de l'événement clic sur chaque image de toutes les galeries
        images.forEach(img => {
            img.addEventListener('click', () => {
                const src = img.getAttribute('src');
                modalImg.src = src;
                modalBg.style.backgroundImage = `url('${src}')`;
                modal.classList.add('active');
            });
        });

        // Fermeture au clic sur le bouton "X"
        btnFermer.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Fermeture au clic en dehors de l'image
        modal.addEventListener('click', (e) => {
            if (e.target === modal || e.target === modalBg) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
