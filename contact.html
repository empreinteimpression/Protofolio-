<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Romain photographie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #faf8f3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #faf8f3;
            padding: 20px 0;
            border-bottom: 1px solid #e8e6e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        /* Logo / marque */

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: #000;
            flex-shrink: 0;
        }

        .brand:hover {
            text-decoration: none;
        }

        /* Espace prévu pour ton futur logo */

        .future-logo {
            width: 55px;
            height: 55px;
            border: 1px dashed #bbb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #999;
            text-transform: uppercase;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .brand:hover .future-logo {
            border-color: #777;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* =========================
           MENU
        ========================= */

        .nav-menu {
            display: flex;
            gap: 40px;
            list-style: none;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: #999;
        }

        /* Bouton contact */

        .contact-btn {
            background: transparent;
            color: #333;
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s, background 0.3s, border 0.3s;
            border: 1px solid #333;
            cursor: pointer;
        }

        .contact-btn.active {
            background: #000;
            color: #fff;
        }

        .contact-btn:hover {
            background: #f0f0f0;
            color: #000;
        }

        .contact-btn.active:hover {
            background: #333;
            color: #fff;
        }

        /* =========================
           CONTACT
        ========================= */

        main {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .contact-hero {
            width: 100%;
            padding: 100px 0;
            text-align: center;
        }

        .contact-hero h1 {
            font-size: 40px;
            font-weight: 300;
            letter-spacing: 1px;
            color: #000;
            margin-bottom: 20px;
        }

        .contact-hero p {
            font-size: 16px;
            color: #666;
            max-width: 550px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        /* Bouton Instagram */

        .contact-btn-large {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 16px 45px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .contact-btn-large:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .contact-note {
            margin-top: 30px;
            font-size: 13px !important;
            color: #999 !important;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #faf8f3;
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid #e8e6e0;
        }

        .copyright {
            color: #999;
            font-size: 12px;
        }

        /* =========================
           TABLETTE
        ========================= */

        @media (max-width: 768px) {

            header {
                padding: 15px 0;
            }

            nav {
                gap: 15px;
            }

            .logo {
                font-size: 18px;
            }

            .future-logo {
                width: 45px;
                height: 45px;
                font-size: 8px;
            }

            .brand {
                gap: 10px;
            }

            .nav-menu {
                gap: 20px;
            }

            .nav-menu a {
                font-size: 12px;
            }

            .contact-btn {
                padding: 10px 20px;
            }

            .contact-hero {
                padding: 80px 0;
            }

            .contact-hero h1 {
                font-size: 32px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 12px 0;
            }

            .container {
                padding: 0 15px;
            }

            nav {
                align-items: center;
            }

            .brand {
                gap: 8px;
            }

            .future-logo {
                width: 40px;
                height: 40px;
                font-size: 7px;
            }

            .logo {
                font-size: 15px;
                letter-spacing: 0.5px;
            }

            .nav-menu {
                gap: 8px;
            }

            .nav-menu li:not(:last-child) {
                display: none;
            }

            .contact-btn {
                padding: 9px 15px;
                font-size: 10px;
            }

            .contact-hero {
                padding: 60px 0;
            }

            .contact-hero h1 {
                font-size: 27px;
                line-height: 1.3;
                margin-bottom: 18px;
            }

            .contact-hero p {
                font-size: 15px;
                padding: 0 10px;
                margin-bottom: 30px;
            }

            .contact-btn-large {
                padding: 15px 25px;
                font-size: 13px;
            }

            footer {
                padding: 30px 0;
            }
        }

        /* =========================
           PETIT MOBILE
        ========================= */

        @media (max-width: 400px) {

            .future-logo {
                width: 36px;
                height: 36px;
            }

            .logo {
                font-size: 13px;
            }

            .contact-btn {
                padding: 8px 12px;
                font-size: 9px;
            }

            .contact-hero h1 {
                font-size: 24px;
            }

            .contact-btn-large {
                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>
        <div class="container">

            <nav>

                <!--
                    Logo + nom du photographe
                    Cliquer dessus renvoie vers l'accueil
                -->

                <a href="index.html" class="brand">

                    <!-- Futur emplacement du logo -->
                    <div class="future-logo">
                        LOGO
                    </div>

                    <div class="logo">
                        Romain photographie
                    </div>

                </a>


                <!-- Menu -->

                <ul class="nav-menu">

                    <li>
                        <a href="index.html#accueil" class="nav-link">
                            Accueil
                        </a>
                    </li>

                    <li>
                        <a href="index.html#galeries" class="nav-link">
                            Galeries
                        </a>
                    </li>

                    <li>
                        <a href="contact.html" class="contact-btn active">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>
    </header>


    <!-- =========================
         CONTENU CONTACT
    ========================= -->

    <main>

        <div class="container">

            <section class="contact-hero">

                <h1>
                    Discutons de votre séance
                </h1>

                <p>
                    Un projet, une date, une envie particulière — écrivez-moi et je réponds sous 48h.
                </p>

                <a
                    href="https://www.instagram.com/direct/t/empreinteimpression"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="contact-btn-large"
                >
                    📸 Message Instagram
                </a>

                <p class="contact-note">
                    Réponse sous 48h en moyenne
                </p>

            </section>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="container">

            <div class="copyright">
                © 2026 Romain photographie. Tous droits réservés.
            </div>

        </div>

    </footer>

</body>
</html>
